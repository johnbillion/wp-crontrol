# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Assets
on:
  push:
    branches:
      - deploy

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-deploy-assets.yml@a048b59a5c12c765cdba381cc67cf97eb67b5bbc
    with:
      plugin: wp-crontrol
      readme: readme.txt
      username: johnbillion
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
