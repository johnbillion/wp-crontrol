# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Acceptance Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - '**.css'
      - '**.js'
      - 'src/**'
      - 'wp-crontrol.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'tsconfig.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - '**.css'
      - '**.js'
      - 'src/**'
      - 'wp-crontrol.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'tsconfig.json'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        include:
          # Latest:
          - wp: '7.1'
            php: '8.5'
          - wp: '7.1'
            php: '7.4'
          # Latest -1:
          - wp: '7.0'
            php: '8.5'
          - wp: '7.0'
            php: '7.4'
          # Latest -2:
          - wp: '6.9'
            php: '8.4'
          - wp: '6.9'
            php: '7.4'
          # Oldest supported:
          - wp: '6.6'
            php: '8.3'
          - wp: '6.6'
            php: '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
    with:
      node: false
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
