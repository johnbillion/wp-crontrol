# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Acceptance Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - '**.css'
      - '**.js'
      - 'src/**'
      - 'wp-crontrol.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'tsconfig.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - '**.css'
      - '**.js'
      - 'src/**'
      - 'wp-crontrol.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'tsconfig.json'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        wp:
          # Latest three stable:
          - '6.9-RC1'
          - '6.8'
          - '6.7'
        php:
          - '8.3'
          - '7.4'
        include:
          # Latest stable on PHP 8.4:
          - wp: '6.9-RC1'
            php: '8.4'
          # Oldest supported WordPress on its newest and oldest supported PHP:
          - wp: '6.4'
            php: '8.3'
          - wp: '6.4'
            php: '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@8f66c43110e0bf6c3eb377bbffd31b613fa3e5f6
    with:
      node: false
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
