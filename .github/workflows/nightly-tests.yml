# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Nightly Tests
on:
  schedule:
    # Once weekly on Mondays at 08:00 UTC.
    #
    #        ┌───────────── minute           (0 - 59)
    #        │  ┌────────── hour             (0 - 23)
    #        │  │  ┌─────── day of the month (1 - 31)
    #        │  │  │  ┌──── month            (1 - 12 or JAN-DEC)
    #        │  │  │  │  ┌─ day of the week  (0 - 6 or SUN-SAT)
    #        │  │  │  │  │
    #        │  │  │  │  │
    #        │  │  │  │  │
    - cron: '0  8  *  *  1'
  push:
    branches:
      - 'develop'
    paths:
      - '.github/workflows/nightly-tests.yml'
  workflow_dispatch:

permissions: {}

jobs:
  acceptance:
    name: Nightly ${{ matrix.label }}
    permissions:
      contents: read
    strategy:
      matrix:
        label:
          - 'acceptance'
        php:
          # Newest and oldest supported versions of PHP
          - '8.3'
          - '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@5a327134e8fabebf5fbf0e8e31c46fa4d36b0d23 # v2.1.0-beta.2
    with:
      node: false
      php: ${{ matrix.php }}
      wp: 'nightly'
      cache: false

  integration:
    name: Nightly ${{ matrix.label }}
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-integration-tests.yml@5a327134e8fabebf5fbf0e8e31c46fa4d36b0d23 # v2.1.0-beta.2
    strategy:
      matrix:
        label:
          - 'integration'
        php:
          # Newest and oldest supported versions of PHP
          - '8.3'
          - '7.4'
      fail-fast: false
    with:
      php: ${{ matrix.php }}
      wp: 'nightly'
      cache: false
